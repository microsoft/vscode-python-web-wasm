steps:
- task: NodeTool@0
  inputs:
    versionSpec: '16.14.2'
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'Install Dependencies'
  target:
    commands: restricted
    settableVariables: none

- script: |
    npm run all
  displayName: 'Verify'
  target:
    commands: restricted
    settableVariables: none